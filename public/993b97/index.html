    <meta property="og:description" content="Indian Overseas Bank (IOB) has announced Security Guard Recruitment 2026 for 25 vacancies in Chennai/Tamil Nadu. The vacancies are exclusively for eligible Ex-Servicemen and Ex-Agniveers from the Army, Navy, or Air Force. Applicants must have passed 10th standard or an equivalent examination, should not have passed Graduation, and must be able to speak, read, and write Tamil. The age limit is 18 to 26 years as on 01/08/2026, with applicable age relaxation for Ex-Servicemen and Ex-Agniveers. Online applications can be submitted from 25/08/2026 to 14/09/2026, and there is no application fee. The selection process includes an Online Objective Test, Tamil Language Test, and Physical Fitness Test comprising Push-Ups, Sit-Ups, a One Kilometre Run, and Drill. Selected candidates will receive pay as per the prescribed subordinate staff pay scale, with basic pay fixed based on their last drawn defence salary.">
