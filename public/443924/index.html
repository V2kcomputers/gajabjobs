    <meta property="og:description" content="Bharat Petroleum Corporation Limited (BPCL) has invited online applications for 154 Non-Management posts at its Mumbai and Kochi Refineries. Vacancies are available for Process Technician (Chemical), Process Operator (Chemical), Technician/Operator (Mechanical), and Technician (Electrical). Candidates holding a full-time Diploma in the relevant engineering discipline with at least one year of post-qualification experience or apprenticeship training can apply. The online application window is open from 29/07/2026 to 13/08/2026. The selection process includes a Computer Based Test (CBT), Skill/Proficiency Test (SPT), Document Verification, and Medical Examination. Selected candidates will receive a pay scale of ₹26,500–₹34,000 along with applicable BPCL allowances and benefits.">
