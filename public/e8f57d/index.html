    <meta property="og:description" content="Navodaya Vidyalaya Samiti has invited online applications for the Class 11th Lateral Entry Selection Test 2027-28 for admission to vacant seats in Jawahar Navodaya Vidyalayas. Eligible candidates can apply online up to 30/09/2026, while the Selection Test is scheduled for 10/04/2027. Candidates must be studying in Class X during the 2026-27 academic session in a Government/Government-recognized school located in the district where the JNV is situated. Applicants must be Indian Nationals studying Class X in India and their date of birth must fall between 01/06/2010 and 31/07/2012. The examination will include 100 objective-type questions carrying 100 marks from Mental Ability, English, Science, Social Science and Mathematics, with a total duration of 2½ hours and no negative marking. Candidates may select a maximum of two streams, depending on the available options and vacant seats. The application is free of cost, and admission will remain subject to Class X qualification, document verification and availability of vacant seats.">
