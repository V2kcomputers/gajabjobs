    <meta property="og:description" content="The Indira Gandhi Centre for Atomic Research (IGCAR), Kalpakkam, has invited online applications for 200 Trade Apprentice posts under the Apprentices Act, 1961. Candidates holding an ITI certificate in the relevant trade can apply online from 20/07/2026 to 19/08/2026. The apprenticeship duration is one year, with a monthly stipend of ₹11,040 for 2-year ITI holders and ₹10,560 for 1-year ITI holders. Selection will be based on ITI merit, followed by document verification and a medical examination. Interested candidates should carefully read the official notification before submitting the online application.">
