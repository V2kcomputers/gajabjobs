    <meta property="og:description" content="UPESSC has announced Assistant Professor Recruitment 2026 for 1,936 posts in Uttar Pradesh. The online application process through OTR is available from 08/09/2026 to 07/10/2026. The vacancies include 1,564 posts in co-education colleges and 372 posts in women’s colleges. Candidates generally require a Master’s degree in the relevant subject with at least 55% marks, along with NET/SLET/SET or applicable Ph.D. exemption as prescribed in the notification. The written examination will be held on 19/11/2026 and 20/11/2026, followed by an interview. The selection process consists of 360 marks for the written exam and 40 marks for the interview, making a total of 400 marks.">
