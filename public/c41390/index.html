    <meta property="og:description" content="The National Testing Agency (NTA) conducts the Joint Entrance Examination (JEE Main) 2027 for admission to undergraduate engineering, architecture and planning programmes. Interested candidates can apply for B.E./B.Tech, B.Arch and B.Planning entrance examinations. Applicants who passed Class 12th in 2025 or 2026, or are appearing in 2027, are eligible to apply. There is no age limit for appearing in this examination. The Session 1 online registration starts on 24 October 2026, and the application deadline is 22 November 2026. The examination will take place on 20, 21, 22, 23, 24 and 28 January 2027. Candidates should check the prescribed subject requirements, application charges, examination schedule and other instructions before completing registration.">
