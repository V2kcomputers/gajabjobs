    <meta property="og:description" content="The Uttar Pradesh Education Service Selection Commission (UPESSC) has invited online applications for 111 Principal vacancies in aided degree colleges under Advertisement No. 02/2026. Candidates with a Ph.D. degree, at least 15 years of teaching or research experience, 10 research publications, and the required API score are eligible to apply. The online application process will be open from 21/07/2026 to 20/08/2026, while the written examination is scheduled for 24/09/2026. Selected candidates will be appointed under Pay Level-14 with a salary ranging from ₹1,44,200 to ₹2,18,200 per month. Applicants are advised to verify their eligibility and complete the online application before the closing date.">
