    <meta property="og:description" content="The Indian Space Research Organisation (ISRO) has invited online applications for 92 Scientist/Engineer &lsquo;SC&rsquo; vacancies in various engineering disciplines. Eligible candidates with a BE/B.Tech degree (minimum 65% marks or 6.84 CGPA) and a valid GATE 2025 or GATE 2026 score can apply online from 28 July 2026 to 17 August 2026. The recruitment includes posts in Electronics, Mechanical, Computer Science, Civil, Electrical, Refrigeration &amp; Air Conditioning, and Architecture. Selection will be based on GATE score and Interview. Selected candidates will receive a starting basic pay of ₹56,100 under Pay Level-10 along with applicable allowances and benefits. Applicants should verify their eligibility and submit the online application before the closing date.">
