    <meta property="og:description" content="Western Coalfields Limited (WCL), a Miniratna company under Coal India Limited, has invited online applications for 444 Statutory Supervisory Staff posts through Advertisement No. 2026/69. The recruitment includes 220 Mining Sirdar and 224 Assistant Foreman (Trainee) (Electrical)/Electrical Supervisor vacancies. The online application process will remain open from 20 July 2026 to 10 August 2026. Selection will be based on a Computer-Based Test (CBT), followed by Document Verification and Medical Examination. Selected candidates will receive an initial basic pay of ₹47,330.25 per month along with DA, HRA, medical facilities, and other admissible benefits. Interested candidates should review the official notification carefully and complete the online application before the closing date.">
