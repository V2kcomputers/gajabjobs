    <meta property="og:description" content="Railway Recruitment Cell (RRC), Northeast Frontier Railway (NFR) has invited online applications for 6777 Act Apprentice vacancies under the Apprentices Act, 1961. Candidates who have passed Class 10 with a valid NCVT/SCVT ITI certificate in the relevant trade are eligible to apply. For Medical Laboratory Technician trades, candidates must have passed Class 10 and 12th (Science with PCB). The online application window will remain open from 20/07/2026 to 19/08/2026. Selection will be based on the merit of Matriculation and ITI marks, followed by document verification and medical examination. Candidates are advised to read the official notification before submitting the online application form.">
