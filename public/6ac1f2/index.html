    <meta property="og:description" content="Navodaya Vidyalaya Samiti has released the notification for Class 9th Lateral Entry Selection Test 2027-28 for admission against vacant seats in Jawahar Navodaya Vidyalayas. Online applications can be submitted from 02/09/2026 to 30/09/2026, and the Selection Test will be conducted on 10/04/2027. Candidates must be bona fide residents of the concerned district and must be studying Class VIII during the 2026-27 academic session in a Government/Government-recognized school of the same district where admission is sought. The candidate’s date of birth must be between 01/05/2012 and 31/07/2014. The selection test will consist of 100 objective questions carrying 100 marks from English, Hindi, Mathematics and General Science, with a duration of 2½ hours and no negative marking. The online application is free of cost, and final admission will be subject to document verification and availability of vacant seats.">
