    <meta property="og:description" content="Indian Army has invited online applications for the JAG Entry Scheme 125th Course (April 2027) to recruit 10 Short Service Commission (SSC) Officers in the Judge Advocate General (JAG) Branch. Eligible unmarried male and female candidates with an LLB degree securing at least 55% marks and a valid CLAT PG 2026 score can apply online from 17/07/2026 to 17/08/2026. The selection process includes application shortlisting, SSB interview, medical examination, and merit list. Selected candidates will undergo 49 weeks of training at OTA Chennai and receive a monthly stipend of ₹56,100 before being commissioned as Lieutenants.">
